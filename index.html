<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Icebreaker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="stars"></div>

  <!-- Device ID -->
  <div id="device-id-display" style="
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
    font-size:12px;
    opacity:.6;
    background:rgba(0,0,0,.5);
    padding:6px 10px;
    border-radius:8px;
  ">
    Device ID: <span id="device-id"></span>
  </div>

  <div class="page-shell">
    <header class="hero">
      <div class="pill">ICEBREAKER</div>

      <h1>taco tuesday</h1>

      <p class="sub">
        site will be updated with aton of features and games this coming week
      </p>

      <div class="hero-actions">
        <a class="btn btn-primary" href="keys.html">
          Enter site
        </a>

        <a class="btn btn-secondary" href="games/index.html">
          Browse games
        </a>

        <a class="btn btn-secondary" href="admin.html">
          🔐 Admin
        </a>

        <button class="btn btn-secondary" onclick="cloakSite()">
          🕶️ Cloak
        </button>
      </div>

      <div class="credit">by Oscar</div>
    </header>

    <section class="home-grid">

      <a class="home-card" href="keys.html">
        <h3>Keys</h3>
        <p>Separate login page with user and admin keys.</p>
      </a>

      <a class="home-card" href="games/index.html">
        <h3>Games</h3>
        <p>very cool skidded.</p>
      </a>

      <a class="home-card" href="admin.html">
        <h3>Admin</h3>
        <p>Manage banned devices.</p>
      </a>

      <a class="home-card" href="README.txt">
        <h3>Settings</h3>
        <p>may or may not exist yet</p>
      </a>

    </section>
  </div>

  <div id="siteBanner" class="bottom-banner"></div>

  <script src="js/config.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/banner.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* =========================
       DEVICE ID
    ========================= */

    let deviceId = localStorage.getItem("icebreaker_device_id");

    if (!deviceId) {
      deviceId = crypto.randomUUID();
      localStorage.setItem("icebreaker_device_id", deviceId);
    }

    document.getElementById("device-id").textContent = deviceId;


    /* =========================
       ABOUT:BLANK CLOAK
    ========================= */

    function cloakSite() {
      const cloak = window.open("about:blank", "_blank");

      if (!cloak) {
        alert("Please allow pop-ups for Icebreaker.");
        return;
      }

      cloak.document.open();

      cloak.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Icebreaker</title>

          <style>
            html, body {
              margin: 0;
              padding: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
              background: #080808;
            }

            iframe {
              width: 100%;
              height: 100%;
              border: 0;
            }
          </style>
        </head>

        <body>
          <iframe src="${window.location.href}"></iframe>
        </body>
        </html>
      `);

      cloak.document.close();
    }


    /* =========================
       SUPABASE / BAN CHECK
    ========================= */

    const cfg = window.SUPABASE_CONFIG;

    if (cfg && window.supabase) {

      const db = window.supabase.createClient(
        cfg.url,
        cfg.anonKey
      );

      async function checkBan() {

        const { data, error } = await db
          .from("icebreaker_bans")
          .select("device_id, reason")
          .eq("device_id", deviceId)
          .maybeSingle();

        if (error) {
          console.error("Ban check failed:", error);
          return;
        }

        if (data) {

          document.body.innerHTML = `
            <div style="
              min-height:100vh;
              display:flex;
              align-items:center;
              justify-content:center;
              background:#080808;
              color:white;
              font-family:Arial,sans-serif;
              text-align:center;
              padding:20px;
            ">

              <div>

                <h1>🚫 You are banned</h1>

                <p>
                  This device has been blocked from Icebreaker.
                </p>

                <p style="opacity:.6">
                  Reason:
                  ${data.reason || "No reason provided"}
                </p>

              </div>

            </div>
          `;
        }
      }

      checkBan();
    }
  </script>

</body>
</html>
